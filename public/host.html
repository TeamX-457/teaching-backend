<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice Verse: Speaker</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
<main>
  <h1>Speaker console</h1>
  <p class="tag"><a href="/" style="color:inherit">Voice Verse</a></p>

  <!-- Step 1: sign in -->
  <section id="auth" class="card">
    <h2>Sign in</h2>
    <form id="authForm">
      <div id="nameWrap" class="hidden">
        <label for="name">Full name</label>
        <input id="name" autocomplete="name">
      </div>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" type="password" minlength="8" autocomplete="current-password" required>
      <div class="row">
        <button type="submit" id="authBtn">Sign in</button>
        <button type="button" class="ghost" id="toggleAuth">Create an account</button>
      </div>
      <p id="authStatus" class="status"></p>
    </form>
  </section>

  <!-- Step 2: create a session -->
  <section id="create" class="card hidden">
    <h2>Start a session</h2>
    <form id="createForm">
      <label for="title">Title</label>
      <input id="title" maxlength="120" placeholder="e.g. SS2 Biology, Sunday Service" required>
      <div class="row">
        <div>
          <label for="venue">Venue</label>
          <select id="venue">
            <option value="classroom">Classroom</option>
            <option value="conference">Conference / seminar</option>
            <option value="church">Church / worship</option>
            <option value="town_hall">Town hall</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div>
          <label for="srcLang">Language you speak</label>
          <select id="srcLang"></select>
        </div>
      </div>
      <button type="submit">Create session</button>
      <p id="createStatus" class="status"></p>
    </form>
  </section>

  <!-- Step 3: speak -->
  <section id="live" class="card hidden">
    <h2 id="liveTitle"></h2>
    <p class="status">Share this code, or the link below, with your audience:</p>
    <div class="code" id="liveCode"></div>
    <p class="status"><a id="shareLink" style="color:var(--accent)" target="_blank" rel="noopener"></a></p>
    <div class="row">
      <button id="micBtn">Start speaking</button>
      <button id="endBtn" class="danger">End session</button>
    </div>
    <p id="micStatus" class="status"></p>
    <div class="captions" id="hostCaptions" style="min-height:25vh;font-size:1.2rem"></div>
  </section>
</main>
<script src="/common.js"></script>
<script>
  let signUp = false;
  let session = null;
  let recognition = null;
  let running = false;
  let sendChain = Promise.resolve();

  fillLangSelect($("srcLang"), "en");

  $("toggleAuth").addEventListener("click", () => {
    signUp = !signUp;
    $("nameWrap").classList.toggle("hidden", !signUp);
    $("name").required = signUp;
    $("authBtn").textContent = signUp ? "Create account" : "Sign in";
    $("toggleAuth").textContent = signUp ? "I already have an account" : "Create an account";
  });

  $("authForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    setStatus($("authStatus"), "Working...");
    try {
      if (signUp) {
        await api("/api/auth/sign-up/email", {
          method: "POST",
          body: { name: $("name").value, email: $("email").value, password: $("password").value, role: "educator" },
        });
      } else {
        await api("/api/auth/sign-in/email", {
          method: "POST",
          body: { email: $("email").value, password: $("password").value },
        });
      }
      await afterLogin();
    } catch (err) {
      setStatus($("authStatus"), err.message, true);
    }
  });

  async function afterLogin() {
    // Only educators can host. The server enforces this; we check to give a clear message.
    try {
      await api("/api/live/sessions/mine");
    } catch (err) {
      if (err.status === 403) return setStatus($("authStatus"), "This account is not a speaker (educator) account.", true);
      if (err.status === 401) return setStatus($("authStatus"), "Sign-in did not complete. Try again.", true);
      return setStatus($("authStatus"), err.message, true);
    }
    $("auth").classList.add("hidden");
    $("create").classList.remove("hidden");
  }

  // Already signed in from an earlier visit?
  api("/api/live/sessions/mine").then(afterLogin).catch(() => {});

  $("createForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    setStatus($("createStatus"), "Creating...");
    try {
      const data = await api("/api/live/sessions", {
        method: "POST",
        body: { title: $("title").value, venueType: $("venue").value, sourceLang: $("srcLang").value },
      });
      session = data.session;
      $("create").classList.add("hidden");
      $("live").classList.remove("hidden");
      $("liveTitle").textContent = session.title;
      $("liveCode").textContent = session.code;
      const link = location.origin + "/listen?code=" + session.code;
      $("shareLink").textContent = link;
      $("shareLink").href = link;
    } catch (err) {
      setStatus($("createStatus"), err.message, true);
    }
  });

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    // Fall through: the page still loads, but the mic button explains why it cannot work.
  }

  function addHostLine(text, interim) {
    const box = $("hostCaptions");
    let last = box.lastElementChild;
    if (last && last.classList.contains("interim")) last.remove();
    const p = document.createElement("p");
    p.textContent = text;
    if (interim) p.classList.add("interim");
    box.appendChild(p);
    box.scrollTop = box.scrollHeight;
  }

  function sendCaption(text) {
    // Sequential, so captions arrive in the order they were spoken.
    sendChain = sendChain.then(() =>
      api(`/api/live/sessions/${session.code}/captions`, { method: "POST", body: { text } }).catch((err) => {
        setStatus($("micStatus"), "Could not send: " + err.message, true);
      }),
    );
  }

  function startRecognition() {
    recognition = new SR();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = session.sourceLang === "en" ? "en-NG" : session.sourceLang;
    recognition.onresult = (ev) => {
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const r = ev.results[i];
        const text = r[0].transcript.trim();
        if (!text) continue;
        if (r.isFinal) {
          addHostLine(text, false);
          sendCaption(text);
        } else {
          addHostLine(text, true);
        }
      }
    };
    recognition.onerror = (ev) => {
      if (ev.error === "not-allowed") {
        running = false;
        $("micBtn").textContent = "Start speaking";
        setStatus($("micStatus"), "Microphone permission was denied.", true);
      }
    };
    // Browsers stop recognition after silence; restart while the speaker is "on".
    recognition.onend = () => {
      if (running) try { recognition.start(); } catch {}
    };
    recognition.start();
  }

  $("micBtn").addEventListener("click", () => {
    if (!SR) return setStatus($("micStatus"), "This browser has no speech recognition. Use Chrome or Edge.", true);
    if (running) {
      running = false;
      recognition.stop();
      $("micBtn").textContent = "Start speaking";
      return setStatus($("micStatus"), "Paused.");
    }
    running = true;
    $("micBtn").textContent = "Pause";
    setStatus($("micStatus"), "Listening. Speak normally.");
    startRecognition();
  });

  $("endBtn").addEventListener("click", async () => {
    if (!confirm("End this session for everyone?")) return;
    running = false;
    if (recognition) recognition.stop();
    await sendChain;
    try {
      await api(`/api/live/sessions/${session.code}/end`, { method: "POST" });
      setStatus($("micStatus"), "Session ended.");
      $("micBtn").disabled = true;
      $("endBtn").disabled = true;
    } catch (err) {
      setStatus($("micStatus"), err.message, true);
    }
  });
</script>
</body>
</html>
