<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice Verse: Live</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
<main>
  <h1 id="title">Voice Verse</h1>
  <p class="tag" id="meta"></p>

  <section class="card">
    <div class="row">
      <div>
        <label for="lang">Show subtitles in</label>
        <select id="lang"></select>
      </div>
      <div>
        <label for="size">Text size</label>
        <select id="size">
          <option value="1.4rem">Small</option>
          <option value="1.9rem" selected>Medium</option>
          <option value="2.6rem">Large</option>
          <option value="3.4rem">Extra large</option>
        </select>
      </div>
    </div>
    <label><input type="checkbox" id="speak" style="width:auto"> Read captions aloud (use earphones)</label>
    <p id="status" class="status"></p>
  </section>

  <div class="captions" id="captions" aria-live="polite"></div>

  <section class="card" id="feedback" style="margin-top:16px">
    <h2>How was it?</h2>
    <div class="stars" id="stars"></div>
    <label for="comment">Comment (optional)</label>
    <textarea id="comment" rows="2" maxlength="1000"></textarea>
    <button id="sendFeedback" disabled>Send feedback</button>
    <p id="fbStatus" class="status"></p>
  </section>
</main>
<script src="/common.js"></script>
<script>
  const code = (new URLSearchParams(location.search).get("code") || "").toUpperCase();
  let info = null;
  let lastSeq = 0;
  let rating = 0;
  let pollTimer = null;
  const seen = [];  // every caption so far, so a language change can re-render

  fillLangSelect($("lang"), "en");

  $("size").addEventListener("change", () => {
    $("captions").style.setProperty("--cap-size", $("size").value);
  });

  function render() {
    const lang = $("lang").value;
    const box = $("captions");
    box.innerHTML = seen.map((c) => {
      if (lang !== info.sourceLang && c.translatedText) {
        return `<p>${escapeHtml(c.translatedText)}<span class="orig">${escapeHtml(c.text)}</span></p>`;
      }
      return `<p>${escapeHtml(c.text)}</p>`;
    }).join("");
    box.scrollTop = box.scrollHeight;
  }

  function speakNew(items) {
    if (!$("speak").checked || !("speechSynthesis" in window)) return;
    for (const c of items) {
      // Spoken in the speaker's language: browsers rarely ship an Ibibio voice.
      const u = new SpeechSynthesisUtterance(c.text);
      u.lang = info.sourceLang === "en" ? "en-NG" : info.sourceLang;
      speechSynthesis.speak(u);
    }
  }

  async function poll() {
    try {
      const lang = $("lang").value;
      const data = await api(`/api/live/sessions/${code}/captions?after=${lastSeq}&lang=${lang}`);
      if (data.captions.length) {
        for (const c of data.captions) { seen.push(c); lastSeq = c.seq; }
        render();
        speakNew(data.captions);
      }
      if (lang !== info.sourceLang && seen.length && !seen.some((c) => c.translated)) {
        setStatus($("status"), "No " + lang.toUpperCase() + " translation yet for this speech; showing the original.");
      } else {
        setStatus($("status"), data.status === "ended" ? "This session has ended." : "Live");
      }
      if (data.status === "ended") { clearInterval(pollTimer); }
    } catch (err) {
      setStatus($("status"), "Reconnecting...", true);
    }
  }

  // Re-fetch from the start when the language changes so older lines get translated too.
  $("lang").addEventListener("change", () => { lastSeq = 0; seen.length = 0; render(); poll(); });

  async function init() {
    if (!code) { location.href = "/"; return; }
    try {
      info = (await api(`/api/live/sessions/${code}`)).session;
    } catch (err) {
      $("title").textContent = "Session not found";
      return setStatus($("status"), "Check the code and try again.", true);
    }
    $("title").textContent = info.title;
    $("meta").textContent = `${info.hostName || "Speaker"} · code ${info.code}`;
    api(`/api/live/sessions/${code}/join`, { method: "POST" }).catch(() => {});
    await poll();
    if (info.status === "live") pollTimer = setInterval(poll, 1500);
  }

  for (let i = 1; i <= 5; i++) {
    const b = document.createElement("button");
    b.className = "ghost";
    b.textContent = "★".repeat(i);
    b.addEventListener("click", () => {
      rating = i;
      $("sendFeedback").disabled = false;
      [...$("stars").children].forEach((x, idx) => x.classList.toggle("ghost", idx !== i - 1));
    });
    $("stars").appendChild(b);
  }

  $("sendFeedback").addEventListener("click", async () => {
    try {
      await api("/api/live/feedback", { method: "POST", body: { code, rating, comment: $("comment").value || undefined } });
      setStatus($("fbStatus"), "Thank you!");
      $("sendFeedback").disabled = true;
    } catch (err) {
      setStatus($("fbStatus"), err.message, true);
    }
  });

  init();
</script>
</body>
</html>
