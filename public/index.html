<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice Verse</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
<main>
  <h1>Voice Verse</h1>
  <p class="tag">No one should be left out because they cannot understand what is being said. Live subtitles and translation for classrooms, conferences, churches and town halls.</p>

  <section class="card">
    <h2>Start listening</h2>
    <form id="start">
      <div class="row">
        <div>
          <label for="inLang">Language being spoken</label>
          <select id="inLang"></select>
        </div>
        <div>
          <label for="outLang">Language I understand</label>
          <select id="outLang"></select>
        </div>
      </div>
      <label for="ctx">Where are you?</label>
      <select id="ctx"></select>
      <p id="note" class="status"></p>
      <button type="submit" class="big">Start Listening</button>
    </form>
  </section>

  <section class="card">
    <h2>Join a speaker's session</h2>
    <form id="join">
      <label for="code">Session code</label>
      <input id="code" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="e.g. K7M2QX" required>
      <button type="submit" class="ghost">Join and read live</button>
    </form>
  </section>

  <p class="row" style="margin-top:8px">
    <a class="btn ghost" href="/history">Past sessions</a>
    <a class="btn ghost" href="/host">Speaker console</a>
  </p>
</main>
<script src="/common.js"></script>
<script>
  let cfg;
  (async () => {
    cfg = await loadLanguages();
    fillLangOptions($("inLang"), cfg, "en");
    fillLangOptions($("outLang"), cfg, "ibb");
    $("ctx").innerHTML = Object.entries(CONTEXTS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
    check();
  })();

  function check() {
    const i = langByCode(cfg, $("inLang").value), o = langByCode(cfg, $("outLang").value);
    let msg = "";
    if (!i.speechRecognition.supported) msg = `Listening in ${i.name} is not available yet. Choose a language that can be recognised.`;
    else if (i.code !== o.code && !o.translation) msg = `Translation into ${o.name} is not available yet.`;
    else if (!cfg.translationProviderConfigured && i.code !== o.code) msg = "Translation service not connected yet: subtitles work, translated text may be limited.";
    $("note").textContent = msg;
    $("note").classList.toggle("error", !i.speechRecognition.supported);
    return i.speechRecognition.supported;
  }
  $("inLang").addEventListener("change", check);
  $("outLang").addEventListener("change", check);

  $("start").addEventListener("submit", (e) => {
    e.preventDefault();
    if (!check()) return;
    const q = new URLSearchParams({ in: $("inLang").value, out: $("outLang").value, ctx: $("ctx").value });
    location.href = "/listening?" + q;
  });
  $("join").addEventListener("submit", (e) => {
    e.preventDefault();
    const code = $("code").value.trim().toUpperCase();
    if (code) location.href = "/listen?code=" + encodeURIComponent(code);
  });
</script>
</body>
</html>
